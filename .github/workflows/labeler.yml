name: Labeler

# pull_request_target lets this label PRs from forks. That's safe here because the job
# never checks out or runs PR code; it only reads the changed-file list.
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0

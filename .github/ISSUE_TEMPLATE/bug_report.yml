name: Bug report
description: Something in Ragforge doesn't work as expected.
title: "bug: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search [existing issues](https://github.com/KrushanPatel/ragforge/issues) first.
        **Security vulnerabilities must not be reported here.** See [SECURITY.md](https://github.com/KrushanPatel/ragforge/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal commands, config or input that trigger the bug.
      placeholder: |
        1. uv sync
        2. uv run ragforge ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      description: Paste relevant output. Remove any secrets or API keys first.
      render: shell
  - type: input
    id: version
    attributes:
      label: Ragforge version or commit
      description: Output of `git rev-parse --short HEAD`, or the package version.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version (`uv run python --version`) and uv version (`uv --version`).
      placeholder: Ubuntu 24.04, Python 3.12.8, uv 0.13.9
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: I removed secrets and credentials from everything above.
          required: true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragforge"
version = "0.1.0"
description = "Production-grade RAG, built step by step"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pypdf>=4.0",
    "python-docx>=1.1",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "qdrant-client>=1.12",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic-settings>=2.3",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
ragforge = "ragforge.cli:app"

# CPU-only PyTorch on Linux/Windows keeps installs small. macOS wheels on PyPI are already CPU/MPS.
# GPU users can override with: uv pip install torch --index-url https://download.pytorch.org/whl/cu128
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/ragforge"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

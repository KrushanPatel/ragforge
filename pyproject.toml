[project]
name = "ragforge"
version = "0.1.0"
description = "Production-grade RAG, built step by step"
readme = "README.md"
authors = [
    { name = "Krushan Patel", email = "krushanpatel2@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.29.0",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.2.0",
    "python-docx>=1.2.0",
    "qdrant-client>=1.20.0",
    "rich>=15.0.0",
    "sentence-transformers>=6.3.0",
    "torch>=2.15.0",
    "typer>=0.29.3",
]

[project.scripts]
ragforge = "ragforge:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

# CPU-only PyTorch on Linux/Windows keeps installs small. macOS wheels on PyPI are already CPU/MPS.
# GPU users can override with: uv pip install torch --index-url https://download.pytorch.org/whl/cu128
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
